services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: a-share-analysis-assistant-backend:latest
    container_name: astock_backend
    environment:
      A_SHARE_DATA_DIR: /app/data
      A_SHARE_FRONTEND_PORT: "18080"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    networks:
      - astock_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        FRONTEND_BASE_IMAGE: ${FRONTEND_BASE_IMAGE:-nginx:1.29-alpine}
    image: a-share-analysis-assistant-frontend:latest
    container_name: astock_frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:18080:80"
    networks:
      - astock_network
    restart: unless-stopped

networks:
  astock_network:
    driver: bridge
